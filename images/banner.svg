<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f26"/>
      <stop offset="0.55" stop-color="#101418"/>
      <stop offset="1" stop-color="#080a0d"/>
    </linearGradient>
    <linearGradient id="amber" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffcd6b"/>
      <stop offset="1" stop-color="#dd8511"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dd8511" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#dd8511" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="330" cy="330" r="320" fill="url(#glow)"/>

  <g fill="#ffcd6b" opacity="0.5">
    <circle cx="120" cy="92" r="3"/>
    <circle cx="220" cy="52" r="2"/>
    <circle cx="760" cy="80" r="2.5"/>
    <circle cx="1180" cy="96" r="2"/>
    <circle cx="1090" cy="540" r="2.5"/>
    <circle cx="700" cy="580" r="2"/>
  </g>

  <!-- Warning triangle with the paw badge, same character as the icon. -->
  <g transform="translate(35.6 26.4) scale(1.15)">
    <path d="M256 104 L444 424 H68 Z" fill="url(#amber)" stroke="url(#amber)"
          stroke-width="26" stroke-linejoin="round"/>
    <g fill="#12151a">
      <ellipse cx="256" cy="354" rx="54" ry="45"/>
      <ellipse cx="192" cy="296" rx="23" ry="28" transform="rotate(-22 192 296)"/>
      <ellipse cx="236" cy="272" rx="23" ry="29" transform="rotate(-8 236 272)"/>
      <ellipse cx="280" cy="272" rx="23" ry="29" transform="rotate(8 280 272)"/>
      <ellipse cx="324" cy="296" rx="23" ry="28" transform="rotate(22 324 296)"/>
    </g>
  </g>

  <rect x="620" y="162" width="88" height="5" rx="2.5" fill="url(#amber)"/>
  <text x="620" y="268" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="86" font-weight="700" letter-spacing="-1">CONTENT</text>
  <text x="620" y="360" fill="#FFCD6B" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="86" font-weight="700" letter-spacing="-1">WARNINGS</text>
  <text x="622" y="420" fill="#B9C7DA" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="28" font-weight="400">Community warnings as native Jellyfin tags</text>

  <rect x="620" y="462" width="196" height="46" rx="23" fill="#DD8511" opacity="0.16"
        stroke="#DD8511" stroke-opacity="0.5"/>
  <text x="648" y="493" fill="#F6D2A8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="20" font-weight="600">Jellyfin plugin</text>

  <text x="836" y="493" fill="#8FA2BC" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="20" font-weight="400">Powered by DoesTheDogDie.com</text>
</svg>

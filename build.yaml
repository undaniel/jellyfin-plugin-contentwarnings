overview: "Content warnings from DoesTheDogDie.com as native Jellyfin tags"
description: >
  Matches movies and series with DoesTheDogDie.com and applies content warning tags
  such as CW: Dog Death or CW: Flashing Lights. Administrators and users can block those
  tags through Jellyfin's parental controls. An optional warning badge is baked into
  posters and episode stills, so it shows in every client. Each administrator uses their
  own DoesTheDogDie API key. Powered by DoesTheDogDie.com.
